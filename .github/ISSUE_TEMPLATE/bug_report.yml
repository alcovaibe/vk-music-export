name: "Ошибка или тестирование / Bug or test report"
description: "Сообщить об ошибке или результатах проверки / Report a bug or test results"
body:
  - type: markdown
    attributes:
      value: |
        Опишите ошибку или проверенные сценарии на устройстве любой поддерживаемой версии Android.
        Report a bug or actual test results on any supported Android version.
        Не публикуйте токены ВК, cookie, пароли, ID аккаунтов, личные данные и ссылки на музыку. Проверьте вложения перед отправкой.
        Do not post VK tokens, cookies, passwords, account IDs, personal data or music URLs. Review attachments before submitting.
        Об уязвимостях сообщайте через Security → Report a vulnerability.
        Report vulnerabilities through Security → Report a vulnerability.
  - type: dropdown
    id: report_type
    attributes:
      label: "Тип сообщения / Report type"
      options:
        - "Ошибка / Bug"
        - "Результаты тестирования / Test results"
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: "Версия и номер сборки / Version and versionCode"
      description: "Для тестовой сборки укажите также SHA или запуск Actions, если известен. / Include commit or Actions run for test builds if known."
      placeholder: "0.13.0 / versionCode"
    validations:
      required: true
  - type: dropdown
    id: build_source
    attributes:
      label: "Источник APK / APK source"
      options:
        - "GitHub Releases — stable"
        - "GitHub Releases — RC / pre-release"
        - "GitHub Actions — debug / test"
        - "Собственная сборка / Self-built"
        - "Другое или неизвестно / Other or unknown"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: "Производитель и модель / Manufacturer and model"
      placeholder: "Samsung Galaxy S25"
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: "Версия Android / Android version"
      description: "API, прошивку и патч безопасности можно указать дополнительно. / API, firmware and security patch are optional."
      placeholder: "Android 16, API 36, One UI"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: "Раздел приложения / Feature"
      options:
        - "Вход и аккаунт / Login and account"
        - "Библиотека и музыка друзей / Library and friends"
        - "Скачивание и очередь / Downloads and queue"
        - "Фоновые операции / Background operations"
        - "Воспроизведение / Playback"
        - "Дубликаты и восстановление / Duplicates and recovery"
        - "Обновление и установка / Updates and installation"
        - "Интерфейс / Interface"
        - "Несколько разделов или другое / Multiple features or other"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: "Описание и результат / Description and result"
      description: "Что произошло и что ожидалось? Для успешной проверки напишите, что именно работает. / Describe actual and expected behavior, or what passed."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Шаги и условия / Steps and conditions"
      description: "Для ошибки перечислите шаги воспроизведения. Для тестирования — выполненные действия, включая фон, блокировку экрана и смену сети. / List reproduction steps or tested actions, including backgrounding, screen lock and network changes."
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: "Повторяемость ошибки / Bug frequency"
      options:
        - "Не относится — успешная проверка / Not applicable — passed"
        - "Каждый раз / Every time"
        - "Иногда / Sometimes"
        - "Один раз / Once"
        - "Не знаю / Unknown"
  - type: textarea
    id: scenarios
    attributes:
      label: "Результаты тестирования — необязательно / Test results — optional"
      description: "Для отчёта тестирования отметьте ОК / СБОЙ / НЕ ПРОВЕРЯЛ. Непроверенные сценарии не считаются успешными. / Mark PASS / FAIL / NOT TESTED."
      placeholder: |
        Установка и запуск / Install and launch:
        Вход ВК / VK login:
        Библиотека, плейлисты и друзья / Library, playlists and friends:
        Скачивание MP3/M4A и M3U8 / Downloads:
        Плеер и экран блокировки / Playback and lock screen:
        Фоновые операции и уведомления / Background and notifications:
        Пауза и продолжение / Pause and resume:
        Дубликаты / Duplicates:
        Пропадание и восстановление сети / Network loss and recovery:
        Перезапуск и сохранность данных / Restart and data:
  - type: textarea
    id: attachments
    attributes:
      label: "Скриншоты, видео и очищенные логи / Screenshots, video and sanitized logs"
      description: "Необязательно. Удалите личные данные и секреты. / Optional. Remove personal data and secrets."
  - type: checkboxes
    id: confirmation
    attributes:
      label: "Подтверждение / Confirmation"
      options:
        - label: "Описаны реальные результаты; секреты и личные данные удалены. / These are actual results; secrets and personal data have been removed."
          required: true
