name: Verify RC or promote accepted APK to stable
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Stable requires committed manual acceptance of the exact candidate APK
        type: choice
        options: [rc, stable]
        default: rc
      candidate_run:
        description: Android workflow run containing the newer signed APK
        required: true
permissions:
  contents: read
concurrency:
  group: release-recovery
  cancel-in-progress: false
jobs:
  verify-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      RELEASE_CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Pin canonical emulator SDK tools
        run: bash tools/pin-sdk-tools.sh "$ANDROID_HOME"
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: VK-Music-Export-release
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Release automation regression tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Check original build tests, source commits, APK hashes, versions and pinned signature
        run: python3 tools/recover-release.py
      - name: Download actual current stable and oldest supported upgrade baseline
        run: python3 tools/download-baselines.py
      - name: Block stable without exact APK acceptance
        if: inputs.channel == 'stable'
        run: python3 tools/release_gate.py
      - name: Re-scan exact candidate dependencies before publication
        run: python3 tools/dependency-audit.py --sbom release-output/sbom.cdx.json --output release-output
      - name: Enable KVM and reserve emulator disk space
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo rm -rf /usr/share/dotnet
      - name: Verify real release upgrade on Android 16
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/upgrade-check-all.sh
      - name: Publish tested APK with original build and verified release commits
        run: python3 tools/publish-release.py
      - name: Save release and upgrade evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Verified-release
          path: |
            release-output/
            upgrade-results/
          if-no-files-found: error
          retention-days: 30
