name: Verify and publish existing signed APKs
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Android workflow run containing the newer signed APK
        required: true
      baseline_run:
        description: Android workflow run containing the older signed APK
        required: true
permissions:
  contents: read
concurrency:
  group: release-recovery
  cancel-in-progress: false
jobs:
  verify-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      BASELINE_RUN: ${{ inputs.baseline_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: VK-Music-Export-release
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: VK-Music-Export-release
          run-id: ${{ inputs.baseline_run }}
          github-token: ${{ github.token }}
          path: baseline
      - name: Release automation regression tests
        run: python3 -m unittest discover -s tools -p 'test_release_tools.py'
      - name: Check original build tests, source commits, APK hashes, versions and pinned signature
        run: python3 tools/recover-release.py
      - name: Enable KVM and reserve emulator disk space
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo rm -rf /usr/share/dotnet
      - name: Verify real release upgrade on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/upgrade-check.sh
      - name: Publish tested binaries with their ORIGINAL source commit
        run: python3 tools/publish-release.py
      - name: Save release and upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Verified-release
          path: |
            release-output/
            upgrade-results/
          if-no-files-found: error
          retention-days: 30
