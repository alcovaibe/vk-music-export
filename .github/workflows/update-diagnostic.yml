name: Inspect updater API 36 evidence
on:
  push:
    branches: [audit/update-channel-diagnostics-20261104]
    paths: [.github/workflows/update-diagnostic.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download the existing failing test evidence without changing an APK or release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41897414632 --repo alcovaibe/vk-music-export --name Update-delivery-API-36 --dir evidence
      - name: Print relevant emulator events
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for file in Path('evidence').rglob('logcat.txt'):
              lines=file.read_text(errors='replace').splitlines()
              selected=[line for line in lines if re.search('ANR|not responding|PackageInstaller|packageinstaller|Harness|[Bb]ackground|BAL_|[Dd]enied|SecurityException|VKUpdate',line)]
              print('\n'.join(selected[-350:]))
          PY
      - name: Read the actual failing screen
        run: |
          if ! command -v tesseract >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y tesseract-ocr
          fi
          tesseract evidence/final.png stdout 2>/dev/null
