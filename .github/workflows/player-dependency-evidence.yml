name: Player dependency evidence
on: pull_request
permissions:
  contents: read
jobs:
  evidence:
    if: github.head_ref == 'codex/background-player'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: Resolve pinned Media3 modules from configured Google and Maven repositories
        run: ./gradlew --write-verification-metadata sha256 --write-locks writeDependencyInventory
      - name: Print dependency changes for review
        run: |
          git diff -- gradle/verification-metadata.xml app/gradle.lockfile
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Player-dependency-evidence
          path: |
            gradle/verification-metadata.xml
            app/gradle.lockfile
          retention-days: 7
