name: Dependency verification candidate
on:
  workflow_dispatch:
  push:
    branches: [fix/audit-stage0-release-delivery-20261104]
    paths: [build.gradle.kts]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Generate a review candidate only; never run tests or publish with it
        run: |
          ./gradlew --write-verification-metadata sha256 help --no-daemon
          git diff -- gradle/verification-metadata.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Dependency-verification-review-candidate
          path: gradle/verification-metadata.xml
          if-no-files-found: error
          retention-days: 30
