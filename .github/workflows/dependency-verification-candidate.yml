name: Dependency verification candidate
on:
  push:
    branches: [fix/dependabot-agp-9.5.3-20261128]
    paths: [.github/workflows/dependency-verification-candidate.yml]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch exact AAPT2 artifacts from Google Maven and record SHA-256
        shell: bash
        run: |
          set -euo pipefail
          v=9.5.3-16666295
          mkdir -p "$RUNNER_TEMP/aapt2"
          cd "$RUNNER_TEMP/aapt2"
          for suffix in linux.jar windows.jar osx.jar pom; do
            if [[ "$suffix" == pom ]]; then file="aapt2-$v.pom"; else file="aapt2-$v-$suffix"; fi
            url="https://dl.google.com/dl/android/maven2/com/android/tools/build/aapt2/$v/$file"
            curl --fail --show-error --silent --location --retry 3 "$url" -o "$file"
            test -s "$file"
            sha256sum "$file"
            if curl --fail --show-error --silent --location "$url.sha256" -o "$file.sha256"; then
              expected=$(awk 'NR==1 {print $1}' "$file.sha256")
              [[ "$expected" =~ ^[0-9a-fA-F]{64}$ ]]
              echo "$expected  $file" | sha256sum --check
            else
              echo "No publisher SHA-256 sidecar for $file"
            fi
          done
