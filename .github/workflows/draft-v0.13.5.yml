name: Draft VK Music Export 0.13.5
on:
  push:
    branches: [codex/draft-v0.13.5]
    paths: [.github/workflows/draft-v0.13.5.yml]
permissions:
  contents: write
concurrency:
  group: draft-vk-music-export-0.13.5
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: 6d507af2b34f8d2bc4ee68a0ac519883db3a7571
      APP_VERSION_CODE: '1661'
      GH_REPO: alcovaibe/vk-music-export
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6d507af2b34f8d2bc4ee68a0ac519883db3a7571
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Pin Android SDK tools and install platform
        run: |
          bash tools/pin-sdk-tools.sh "$ANDROID_HOME"
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      - name: Verify source and version
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          grep -Fx 'versionName=0.13.5' version.properties
          grep -Fx "versionCode=$APP_VERSION_CODE" version.properties
          test -s gradle/verification-metadata.xml && test -s app/gradle.lockfile
      - name: Restore permanent signing key
        env:
          ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING }}
        run: python3 tools/prepare-signing.py
      - name: Build signed APK and verify its certificate and version
        env:
          GH_TOKEN: ${{ github.token }}
        run: GITHUB_SHA="$SOURCE_SHA" bash tools/build-release.sh
      - name: Save draft with APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v0.13.5-build.1661
          apk=VK-Music-Export-0.13.5-1661.apk
          if ! gh release view "$tag" --json isDraft,assets,targetCommitish > "$RUNNER_TEMP/draft-release.json" 2>/dev/null; then
            cat > "$RUNNER_TEMP/draft-release-notes.md" <<'NOTES'
          - Добавление найденных треков в «Мою музыку».
          - Скачивание из поиска и плеера.
          - Открытие и отправка ссылок ВК на треки, плейлисты и альбомы.

          [Исходный код сборки](https://github.com/alcovaibe/vk-music-export/tree/6d507af2b34f8d2bc4ee68a0ac519883db3a7571).
          Лицензия GPL-3.0-or-later.
          NOTES
            gh release create "$tag" "release-output/$apk" release-output/SHA256SUMS.txt release-output/build-info.json \
              --draft --latest=false --target "$SOURCE_SHA" --title 'VK Music Export 0.13.5 · 1661' \
              --notes-file "$RUNNER_TEMP/draft-release-notes.md"
            gh release view "$tag" --json isDraft,assets,targetCommitish > "$RUNNER_TEMP/draft-release.json"
          fi
          jq -e --arg sha "$SOURCE_SHA" --arg apk "$apk" \
            '.isDraft and .targetCommitish == $sha and ([.assets[].name] | index($apk) != null)' \
            "$RUNNER_TEMP/draft-release.json"
      - name: Remove runner signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/vk-music-export-release.p12"
