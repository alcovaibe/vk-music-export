name: Refresh AGP verification evidence
on: pull_request
permissions:
  contents: read
jobs:
  refresh:
    if: github.head_ref == 'dependabot/gradle/com.android.application-9.5.0'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: bash tools/pin-sdk-tools.sh "$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Generate candidate metadata for review
        run: ./gradlew --write-verification-metadata sha256 --write-locks testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease assembleDebugAndroidTest writeDependencyInventory --stacktrace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: AGP-verification-candidate
          path: |
            gradle/verification-metadata.xml
            app/gradle.lockfile
          if-no-files-found: error
