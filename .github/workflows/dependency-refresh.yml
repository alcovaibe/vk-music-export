name: Temporary dependency refresh
on:
  pull_request:
permissions:
  contents: read
jobs:
  refresh:
    if: github.event.pull_request.number == 72
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Generate candidate verification and locks
        run: ./gradlew --write-verification-metadata sha256 --write-locks testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease assembleDebugAndroidTest writeDependencyInventory --stacktrace
      - name: Export candidate dependency changes for review
        if: always()
        run: |
          python3 - <<'PY'
          import base64, subprocess
          diff = subprocess.check_output(['git','diff','--','gradle/verification-metadata.xml','app/gradle.lockfile'])
          print('DEPENDENCY_PATCH_BASE64=' + base64.b64encode(diff).decode())
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: Candidate-dependency-refresh
          path: |
            gradle/verification-metadata.xml
            app/gradle.lockfile
          if-no-files-found: error
