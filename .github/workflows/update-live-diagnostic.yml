name: Inspect current public update channel
on:
  push:
    branches: [audit/update-channel-diagnostics-20261104]
    paths: [.github/workflows/update-live-diagnostic.yml]
permissions:
  contents: read
jobs:
  live-channel:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read the exact anonymous app URL and compare it with Latest
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess,urllib.request
          def api(path): return json.loads(subprocess.check_output(['gh','api','repos/alcovaibe/vk-music-export/'+path]))
          url='https://raw.githubusercontent.com/alcovaibe/vk-music-export/main/docs/updates/android.json'
          request=urllib.request.Request(url,headers={'Cache-Control':'no-cache','Accept':'application/json','User-Agent':'VK-Music-Export-Channel-Audit/1'})
          with urllib.request.urlopen(request,timeout=20) as response:
              body=response.read(16385)
              assert response.status==200 and len(body)<=16384
          public=json.loads(body)
          latest=api('releases/latest')
          main=api('branches/main')
          item=public['release']
          assets=[a for a in latest['assets'] if a['name']==item['apk']]
          aligned=(latest['tag_name']==item['tag'] and not latest['draft'] and not latest['prerelease'] and len(assets)==1
                   and assets[0]['size']==item['size'] and assets[0].get('digest')=='sha256:'+item['sha256'])
          result={'url':url,'public_manifest':public,'raw_body_sha256':hashlib.sha256(body).hexdigest(),
                  'latest_id':latest['id'],'latest_tag':latest['tag_name'],'latest_commit':latest['target_commitish'],
                  'main_sha':main['commit']['sha'],'main_protected':main['protected'],'delivery_verified':aligned}
          print('LIVE_CHANNEL_RESULT='+json.dumps(result,ensure_ascii=False))
          if not aligned: raise SystemExit('NOT DELIVERED: public raw channel differs from Latest; main owner approval remains required.')
          PY
