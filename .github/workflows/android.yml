name: Android checks and APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Release automation regression tests
        run: python3 -m unittest discover -s tools -p 'test_release_tools.py'
      - name: Extractor regression tests
        run: |
          npm ci --prefix tools --ignore-scripts --no-audit --no-fund
          node --test tools/extractor.test.cjs tools/collector.test.cjs
      - name: Collector on real Chromium with synthetic pages
        run: |
          npm install --prefix "$RUNNER_TEMP/collector-test" playwright-core@1.62.1 --ignore-scripts --no-audit --no-fund
          NODE_PATH="$RUNNER_TEMP/collector-test/node_modules" node --test tools/collector-browser.test.cjs
      - name: Test, lint and assemble
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VK-Music-Export-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile interface APKs before booting the emulator
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Verify interface on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/interface-check.sh
      - name: Upload interface screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-interface
          path: |
            interface-screenshots/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7

  release:
    # Signing secrets are never exposed to PR code or non-main branches.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, interface]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Allocate increasing Android versionCode
        # Keep this workflow path and offset stable. Runs may have gaps; never reuse lower codes.
        run: echo "APP_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Restore permanent signing key
        env:
          ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING }}
        run: python3 tools/prepare-signing.py
      - name: Build release and verify against installed 0.6.0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash tools/build-release.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reserve space for the Android userdata partition
        # The hosted runner's preinstalled .NET SDK is unused by this Android project.
        run: |
          sudo rm -rf /usr/share/dotnet
          df -h /home/runner
      - name: Verify release upgrade and data on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/upgrade-check.sh
      - name: Publish tested APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 tools/publish-release.py
      - name: Upload release and upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VK-Music-Export-release
          path: |
            release-output/
            upgrade-results/
            app/build/reports/lint-results-release.html
          if-no-files-found: error
          retention-days: 30
      - name: Remove runner signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/vk-music-export-release.p12"
