name: Android checks and APK
on:
  push:
    branches: [main, codex/music-library-redesign, codex/music-followups]
  pull_request:
  workflow_dispatch:
    inputs:
      channel:
        description: Checks only, or an explicitly requested release candidate
        type: choice
        options: [checks, rc]
        default: checks
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Pin canonical emulator SDK tools
        run: bash tools/pin-sdk-tools.sh "$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: CI and release automation regression tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Test, lint and R8 with committed dependency verification
        run: |
          test -s gradle/verification-metadata.xml && test -s app/gradle.lockfile
          ./gradlew --dependency-verification strict testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease writeDependencyInventory --stacktrace
      - name: Generate SBOM and scan resolved dependencies with OSV
        run: python3 tools/dependency-audit.py
      - name: Upload dependency evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Dependency-evidence
          path: |
            gradle/verification-metadata.xml
            app/gradle.lockfile
            app/build/reports/dependencies/
            dependency-reports/
          if-no-files-found: error
          retention-days: 30
      - name: Upload installable debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VK-Music-Export-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Android-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

  interface-tests:
    name: interface (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 29
            sdk-level: '29'
            target: default
            ram-size: 2048M
          - api-level: 30
            sdk-level: '30'
            target: default
            ram-size: 2048M
          - api-level: 31
            sdk-level: '31'
            target: default
            ram-size: 2048M
          - api-level: 32
            sdk-level: '32'
            target: default
            ram-size: 2048M
          - api-level: 33
            sdk-level: '33'
            target: default
            ram-size: 2048M
          - api-level: 34
            sdk-level: '34'
            target: default
            ram-size: 2048M
          - api-level: 35
            sdk-level: '35'
            target: default
            ram-size: 2048M
          - api-level: 36
            sdk-level: '36'
            target: default
            ram-size: 2048M
          - api-level: 37
            sdk-level: '37.0'
            target: google_apis
            ram-size: 4096M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Pin canonical emulator SDK tools
        run: bash tools/pin-sdk-tools.sh "$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reserve emulator disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          df -h /home/runner
      - name: Compile interface APKs before booting the emulator
        run: ./gradlew --dependency-verification strict assembleDebug assembleDebugAndroidTest -Pkotlin.compiler.execution.strategy=in-process --stacktrace
      - name: Release compiler memory before booting the emulator
        run: |
          ./gradlew --stop
          free -m
      - name: Verify interface on Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.sdk-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          ram-size: ${{ matrix.ram-size }}
          disk-size: 8G
          pre-emulator-launch-script: grep -E '^target=android-${{ matrix.api-level }}([.]0)?$' "$ANDROID_AVD_HOME/test.ini"
          disable-animations: true
          script: bash tools/interface-check.sh ${{ matrix.api-level }}
      - name: Upload interface screenshots and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Android-interface-API-${{ matrix.api-level }}
          path: |
            interface-screenshots/
            interface-diagnostics/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7

  # Keep the stable check name used by release provenance validation.
  # This succeeds only after all Android 10–17 tests succeed.
  interface:
    needs: interface-tests
    runs-on: ubuntu-latest
    steps:
      - name: Confirm all nine API levels passed
        run: echo 'Interface checks passed on API 29, 30, 31, 32, 33, 34, 35, 36 and 37.'

  release:
    # Normal pushes/PRs run checks only. An owner-requested release requires its marker and pinned build inputs.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.channel == 'rc' && startsWith(github.ref, 'refs/heads/')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/codex/music-library-redesign' && contains(github.event.head_commit.message, '[publish-pr-48]')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/codex/music-followups' && contains(github.event.head_commit.message, '[publish-pr-50]')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-main-0.11.9]'))
    needs: [build, interface]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Pin canonical emulator SDK tools
        run: bash tools/pin-sdk-tools.sh "$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Allocate increasing Android versionCode
        # Keep this workflow path and offset stable. Runs may have gaps; never reuse lower codes.
        run: echo "APP_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Require committed dependency verification before signing
        run: test -s gradle/verification-metadata.xml && test -s app/gradle.lockfile
      - name: Check exact owner request and pinned build inputs
        if: github.event_name == 'push'
        run: python3 tools/promote-owner-release.py --check
      - name: Restore permanent signing key
        env:
          ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING }}
        run: python3 tools/prepare-signing.py
      - name: Build RC and verify signatures against current stable and oldest supported baseline
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash tools/build-release.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reserve space for the Android userdata partition
        # The hosted runner's preinstalled .NET SDK is unused by this Android project.
        run: |
          sudo rm -rf /usr/share/dotnet
          df -h /home/runner
      - name: Verify release upgrade and data on Android 16
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/upgrade-check-all.sh
      - name: Generate public dependency evidence
        run: |
          ./gradlew --dependency-verification strict writeDependencyInventory
          python3 tools/dependency-audit.py
          cp dependency-reports/*.json release-output/
      - name: Publish tested RC to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_CHANNEL: rc
        run: python3 tools/publish-release.py
      - name: Publish this owner-requested build as Latest
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/promote-owner-release.py --promote
      - name: Upload release and upgrade evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VK-Music-Export-release
          path: |
            release-output/
            upgrade-results/
            app/build/reports/lint-results-release.html
          if-no-files-found: error
          retention-days: 30
      - name: Remove runner signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/vk-music-export-release.p12"
