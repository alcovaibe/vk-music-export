name: Android checks and APK
on:
  push:
    branches: [main, 'fix/**', codex/music-library-redesign, codex/music-followups]
  pull_request:
  workflow_dispatch:
    inputs:
      channel:
        description: Checks only, or an explicitly requested release candidate
        type: choice
        options: [checks, rc]
        default: checks
      expected_sha:
        description: Optional inspected channel PR head; fail if the branch moved before dispatch
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # A generated update-channel JSON commit must not rerun the Android emulator
  # matrix after the signed APK was already verified. All PRs, manual dispatches,
  # release markers and changes to code/workflows still require full CI.
  changes:
    name: Detect generated update-channel-only push
    runs-on: ubuntu-latest
    outputs:
      run_android: ${{ steps.scope.outputs.run_android }}
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require the inspected dispatch head
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          python3 - <<'PYHEAD'
          import os, re
          expected = os.environ.get('EXPECTED_SHA', '')
          if expected and (not re.fullmatch(r'[0-9a-f]{40}', expected) or expected != os.environ['GITHUB_SHA']):
              raise SystemExit('Channel branch moved after inspection; checks refuse another head')
          PYHEAD
      - name: Validate channel even when Android binaries are unchanged
        run: python3 tools/check-update-channel.py --manifest docs/updates/android.json --schema-only
      - name: Classify changed files, failing open
        id: scope
        run: python3 tools/ci-change-scope.py

  build:
    needs: changes
    if: ${{ needs.changes.outputs.run_android == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Pin canonical emulator SDK tools
        run: bash tools/pin-sdk-tools.sh "$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: CI and release automation regression tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Resolve Gradle configuration before compilation
        timeout-minutes: 5
        run: python3 tools/gradle_preflight.py
      - name: Test, lint and R8 with committed dependency verification
        run: |
          test -s gradle/verification-metadata.xml && test -s app/gradle.lockfile
          ./gradlew --dependency-verification strict testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease writeDependencyInventory writeBuildToolInventory --stacktrace || {
            for report in app/build/reports/lint-results-{debug,release}.txt app/build/intermediates/lint_intermediate_text_report/{debug,release}/lintReport{Debug,Release}/lint-results-{debug,release}.txt; do
              if [[ -f "$report" ]]; then echo "=== $report ==="; sed -n '1,300p' "$report"; fi
            done
            exit 1
          }
      - name: Generate SBOM and scan application plugins and Actions with OSV
        run: |
          python3 tools/toolchain-inventory.py
          python3 tools/dependency-audit.py --build-inventory build/reports/dependencies/build-tools.txt --toolchain dependency-reports/toolchain.json
      - name: Upload dependency evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Dependency-evidence
          path: |
            gradle/verification-metadata.xml
            app/gradle.lockfile
            app/build/reports/dependencies/
            build/reports/dependencies/
            dependency-reports/
          if-no-files-found: error
          retention-days: 30
      - name: Upload installable debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VK-Music-Export-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Android-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

  interface-tests:
    name: interface (API ${{ matrix.api-level }})
    needs: changes
    if: ${{ needs.changes.outputs.run_android == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 29
            sdk-level: '29'
            target: default
            ram-size: 2048M
          - api-level: 30
            sdk-level: '30'
            target: default
            ram-size: 2048M
          - api-level: 31
            sdk-level: '31'
            target: default
            ram-size: 2048M
          - api-level: 32
            sdk-level: '32'
            target: default
            ram-size: 2048M
          - api-level: 33
            sdk-level: '33'
            target: default
            ram-size: 2048M
          - api-level: 34
            sdk-level: '34'
            target: default
            ram-size: 2048M
          - api-level: 35
            sdk-level: '35'
            target: default
            ram-size: 2048M
          - api-level: 36
            sdk-level: '36'
            target: default
            ram-size: 2048M
          - api-level: 37
            sdk-level: '37.0'
            target: google_apis
            ram-size: 4096M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Pin canonical emulator SDK tools
        run: bash tools/pin-sdk-tools.sh "$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reserve emulator disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          df -h /home/runner
      - name: Resolve Gradle configuration before compilation
        timeout-minutes: 5
        run: python3 tools/gradle_preflight.py
      - name: Compile interface APKs before booting the emulator
        run: ./gradlew --dependency-verification strict assembleDebug assembleDebugAndroidTest -Pkotlin.compiler.execution.strategy=in-process --stacktrace
      - name: Build API 29–33 compatible debug upgrade pair
        if: ${{ matrix.api-level <= 33 }}
        run: |
          mkdir -p compatibility-apks
          cp app/build/outputs/apk/debug/app-debug.apk compatibility-apks/baseline.apk
          APP_VERSION_CODE=2000000000 ./gradlew --dependency-verification strict assembleDebug -Pkotlin.compiler.execution.strategy=in-process --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk compatibility-apks/upgrade.apk

      - name: Release compiler memory before booting the emulator
        run: |
          ./gradlew --stop
          free -m
      - name: Verify interface on Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.sdk-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          ram-size: ${{ matrix.ram-size }}
          disk-size: 8G
          pre-emulator-launch-script: grep -E '^target=android-${{ matrix.api-level }}([.]0)?$' "$ANDROID_AVD_HOME/test.ini"
          disable-animations: true
          script: bash tools/interface-check.sh ${{ matrix.api-level }}
      - name: Upload interface screenshots and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Android-interface-API-${{ matrix.api-level }}
          path: |
            interface-screenshots/
            interface-diagnostics/
            interface-benchmarks/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7

  sast:
    name: SAST (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.run_android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {language: java-kotlin, mode: manual}
          - {language: python, mode: none}
          - {language: actions, mode: none}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        if: matrix.language == 'java-kotlin'
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        if: matrix.language == 'java-kotlin'
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
        if: matrix.language == 'java-kotlin'
      - uses: github/codeql-action/init@5895b2c9be147bc7f1c75ce72c5cb577febb1907
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.mode }}
          queries: security-extended
      - name: Trace actual Java and Kotlin compilation
        if: matrix.language == 'java-kotlin'
        run: ./gradlew --dependency-verification strict --no-daemon --no-configuration-cache -Pkotlin.compiler.execution.strategy=in-process assembleDebug --stacktrace
      - uses: github/codeql-action/analyze@5895b2c9be147bc7f1c75ce72c5cb577febb1907
        with:
          output: sast-results
          upload: never
          upload-database: false
      - name: Require complete analysis and review of every finding
        run: python3 tools/check-sast.py sast-results config/sast-reviewed.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: SAST-${{ matrix.language }}
          path: sast-results/
          if-no-files-found: error
          retention-days: 30

  r8-playback:
    name: R8 playback (API ${{ matrix.api }})
    needs: [changes, build]
    if: needs.changes.outputs.run_android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: 29, sdk: '29', target: default}
          - {api: 36, sdk: '36', target: default}
          - {api: 37, sdk: '37.0', target: google_apis}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: bash tools/pin-sdk-tools.sh "$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Compile dedicated non-debuggable minified playback test
        run: ./gradlew --dependency-verification strict -Pr8PlaybackCheck=true assembleRelease assembleReleaseAndroidTest -Pkotlin.compiler.execution.strategy=in-process --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: ./gradlew --stop
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.sdk }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          script: bash tools/r8-playback-check.sh ${{ matrix.api }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: R8-playback-API-${{ matrix.api }}
          path: |
            r8-evidence/
            app/build/outputs/mapping/release/
            app/build/outputs/androidTest-results/
          if-no-files-found: error
          retention-days: 30

  channel-delivery:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Pin canonical emulator SDK tools
        run: bash tools/pin-sdk-tools.sh "$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Verify candidate public APK, signature and actual manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/check-update-channel.py --manifest docs/updates/android.json --verify-apk
      - name: Verify actual public channel after a main update
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/check-update-channel.py --verify-apk --public-retries 6 --output channel-evidence/public
      - name: Resolve Gradle configuration before compilation
        if: needs.changes.outputs.run_android == 'true'
        timeout-minutes: 5
        run: python3 tools/gradle_preflight.py
      - name: Prepare real signed updater fixtures and isolated test host
        if: needs.changes.outputs.run_android == 'true'
        run: |
          python3 tools/prepare-update-fixtures.py
          ./gradlew --dependency-verification strict assembleDebug assembleDebugAndroidTest -PupdaterTestHost=true -Pkotlin.compiler.execution.strategy=in-process --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk channel-evidence/host.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk channel-evidence/tests.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: Update-channel-fixtures
          path: channel-evidence/
          if-no-files-found: error
          retention-days: 30

  updater-tests:
    name: updater (API ${{ matrix.api-level }})
    needs: [changes, channel-delivery]
    if: needs.changes.outputs.run_android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 29
            sdk-level: '29'
            target: default
            ram-size: 2048M
          - api-level: 30
            sdk-level: '30'
            target: default
            ram-size: 2048M
          - api-level: 31
            sdk-level: '31'
            target: default
            ram-size: 2048M
          - api-level: 32
            sdk-level: '32'
            target: default
            ram-size: 2048M
          - api-level: 33
            sdk-level: '33'
            target: default
            ram-size: 2048M
          - api-level: 34
            sdk-level: '34'
            target: default
            ram-size: 2048M
          - api-level: 35
            sdk-level: '35'
            target: default
            ram-size: 2048M
          - api-level: 36
            sdk-level: '36'
            target: default
            ram-size: 2048M
          - api-level: 37
            sdk-level: '37.0'
            target: google_apis
            ram-size: 4096M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Pin canonical emulator SDK tools
        run: bash tools/pin-sdk-tools.sh "$ANDROID_HOME"
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: Update-channel-fixtures
          path: channel-evidence/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify real signed APK through updater and system installer
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.sdk-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          ram-size: ${{ matrix.ram-size }}
          disk-size: 8G
          pre-emulator-launch-script: grep -E '^target=android-${{ matrix.api-level }}([.]0)?$' "$ANDROID_AVD_HOME/test.ini"
          disable-animations: true
          script: bash tools/update-delivery-check.sh ${{ matrix.api-level }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: Update-delivery-API-${{ matrix.api-level }}
          path: update-delivery-results/
          if-no-files-found: error
          retention-days: 30

  # Preserve the required stable check. On docs-only main pushes it records
  # the intentional, independently verified skip; on every code/PR run it
  # succeeds only when all nine Android API jobs succeed.
  interface:
    needs: [changes, interface-tests, channel-delivery, updater-tests, r8-playback, sast]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful matrix or verified generated-JSON-only change
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_ANDROID: ${{ needs.changes.outputs.run_android }}
          MATRIX_RESULT: ${{ needs.interface-tests.result }}
          CHANNEL_RESULT: ${{ needs.channel-delivery.result }}
          UPDATER_RESULT: ${{ needs.updater-tests.result }}
          R8_RESULT: ${{ needs.r8-playback.result }}
          SAST_RESULT: ${{ needs.sast.result }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$CHANNEL_RESULT" = success
          if [[ "$RUN_ANDROID" == true ]]; then
            test "$MATRIX_RESULT" = success
            test "$UPDATER_RESULT" = success
            test "$R8_RESULT" = success
            test "$SAST_RESULT" = success
            echo 'Interface checks passed on API 29, 30, 31, 32, 33, 34, 35, 36 and 37.'
          else
            test "$RUN_ANDROID" = false
            test "$MATRIX_RESULT" = skipped
            test "$UPDATER_RESULT" = skipped
            test "$R8_RESULT" = skipped
            test "$SAST_RESULT" = skipped
            echo 'Generated update-channel JSON only: Android binaries and sources unchanged.'
          fi

  release:
    # Normal pushes/PRs run checks only. An owner-requested release requires its marker and pinned build inputs.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.channel == 'rc' && startsWith(github.ref, 'refs/heads/')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/codex/music-library-redesign' && contains(github.event.head_commit.message, '[publish-pr-48]')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/codex/music-followups' && contains(github.event.head_commit.message, '[publish-pr-50]')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, '[publish-main-0.12.0]') || contains(github.event.head_commit.message, '[publish-main-0.12.1]')))
    needs: [build, interface]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Pin canonical emulator SDK tools
        run: bash tools/pin-sdk-tools.sh "$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Allocate increasing Android versionCode
        # Keep this workflow path and offset stable. Runs may have gaps; never reuse lower codes.
        run: echo "APP_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Require committed dependency verification before signing
        run: test -s gradle/verification-metadata.xml && test -s app/gradle.lockfile
      - name: Check exact owner request and pinned build inputs
        if: github.event_name == 'push'
        run: python3 tools/promote-owner-release.py --check
      - name: Resolve Gradle configuration before compilation
        timeout-minutes: 5
        run: python3 tools/gradle_preflight.py
      - name: Restore permanent signing key
        env:
          ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING }}
        run: python3 tools/prepare-signing.py
      - name: Build RC and verify signatures against current stable and oldest supported baseline
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash tools/build-release.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reserve space for the Android userdata partition
        # The hosted runner's preinstalled .NET SDK is unused by this Android project.
        run: |
          sudo rm -rf /usr/share/dotnet
          df -h /home/runner
      - name: Verify release upgrade and data on Android 16
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/upgrade-check-all.sh
      - name: Preserve full Android reports in permanent public release evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: Android-*
          path: release-evidence-input/
      - name: Preserve updater integration reports in permanent public release evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: Update-*
          path: release-evidence-input/
      - name: Preserve R8 playback evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: R8-*
          path: release-evidence-input/
      - name: Preserve SAST evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: SAST-*
          path: release-evidence-input/
      - name: Preserve full resolved dependency graphs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: Dependency-evidence
          path: release-evidence-input/Dependency-evidence/
      - name: Record public CI provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/record-ci-origin.py
      - name: Generate public dependency evidence
        run: |
          ./gradlew --dependency-verification strict writeDependencyInventory writeBuildToolInventory
          python3 tools/toolchain-inventory.py
          python3 tools/dependency-audit.py --build-inventory build/reports/dependencies/build-tools.txt --toolchain dependency-reports/toolchain.json
          cp dependency-reports/*.json release-output/
      - name: Publish tested RC to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_CHANNEL: rc
        run: python3 tools/publish-release.py
      - name: Publish this owner-requested build as Latest
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/promote-owner-release.py --promote
      - name: Upload release and upgrade evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VK-Music-Export-release
          path: |
            release-output/
            upgrade-results/
            app/build/reports/lint-results-release.html
          if-no-files-found: error
          retention-days: 30
      - name: Remove runner signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/vk-music-export-release.p12"
